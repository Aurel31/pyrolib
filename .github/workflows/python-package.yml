# Install dependencies, lint, type check, build and test across the supported Python versions.
# See: https://docs.github.com/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    # ruff and ty versions are pinned in the `lint` extra.
    - name: Install package and lint dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[lint,numba]"

    - name: Lint with ruff
      run: ruff check --output-format=github src tests

    - name: Check formatting with ruff
      run: ruff format --check --diff src tests

    # Advisory until the code base is annotated: most remaining diagnostics are
    # attributes initialised to None in __init__. Plain output on purpose, so the
    # known diagnostics do not show up as annotations on every pull request.
    - name: Type check with ty
      continue-on-error: true
      run: ty check --python "$(which python)" --output-format=concise

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[tests]"

    - name: Test with pytest
      run: pytest

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install package and doc dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[docs]"

    # Warnings are errors here so doc rot fails CI instead of the published site.
    - name: Build the documentation
      run: python -m sphinx -b html -W --keep-going docs docs/_build/html

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build

    - name: Check metadata
      run: twine check --strict dist/*

    # Guards against regressing the package-data globs: the fuel databases live
    # in a subdirectory that an earlier `data/*.y*ml` pattern silently missed.
    - name: Verify packaged data files
      run: |
        python -m zipfile -l dist/*.whl | grep 'pyrolib/data/Default_MNH_namelist.yml'
        python -m zipfile -l dist/*.whl | grep 'pyrolib/data/fuel_db/DefaultSA.yml'
        python -m zipfile -l dist/*.whl | grep 'pyrolib/data/fuel_db/FireFluxI.yml'

    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
